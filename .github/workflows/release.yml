name: Release

on:
  workflow_dispatch:
  push:

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    env:
      MORPHE_BUILD_DEPS: ${{ github.workspace }}/.build-dependencies
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Build matching public source tags instead of depending on GitHub Packages token scopes.
      - name: Checkout Morphe Gradle plugin
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches-gradle-plugin
          ref: v1.3.4
          path: .build-dependencies/patches-gradle-plugin
          persist-credentials: false

      - name: Checkout Morphe Patcher
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patcher
          ref: v1.15.1
          path: .build-dependencies/morphe-patcher
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Verify Discord protocol
        run: ./gradlew -p verification/discord test --no-daemon

      # Semantic release runs its own Gradle build command.
      # Only dev and main branch will generate a release as specified by .releaserc
      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Dyskal YouTube Music Discord RPC ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Always verify compilation when semantic-release did not publish a release.
      # This covers non-main/dev branches, chore commits, docs commits, etc.
      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid :patches:test --no-daemon
